name: GlitchyGames Pyodide wheel

# GlitchyGames' fork only: builds the Pyodide (WebAssembly) wheel of the glitchygames-wasm
# branch with buildconfig/glitchygames/build_pyodide_wheel.sh (Pyodide 314.0.3, the runtime
# PyScript 2026.7.3 pins). Every push uploads the wheel and build-info.json as an artifact; a
# glitchygames-wasm-* tag also publishes them as a GitHub release, the URL GlitchyGames pins.
on:
  push:
    branches: [glitchygames-wasm]
    tags: ['glitchygames-wasm-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-pyodide-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@v7

    # pyodide-build's venv, the cross-build environment and Emscripten with its built ports
    - uses: actions/cache@v5.0.3
      with:
        path: ~/.cache/glitchygames-pyodide-build
        key: pyodide-build-314.0.3-${{ hashFiles('buildconfig/glitchygames/build_pyodide_wheel.sh') }}

    - name: Build the Pyodide wheel
      run: buildconfig/glitchygames/build_pyodide_wheel.sh . dist-pyodide

    - uses: actions/upload-artifact@v6
      with:
        name: glitchygames-pyodide-wheel
        path: |
          dist-pyodide/*.whl
          dist-pyodide/build-info.json

  release:
    if: startsWith(github.ref, 'refs/tags/glitchygames-wasm-')
    needs: build-pyodide-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: glitchygames-pyodide-wheel
        path: dist-pyodide

    - uses: softprops/action-gh-release@v2
      with:
        files: |
          dist-pyodide/*.whl
          dist-pyodide/build-info.json
